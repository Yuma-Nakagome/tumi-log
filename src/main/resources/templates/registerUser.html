<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registerUser</title>
</head>

<body>
    <h1>新規登録</h1>

    <form method="post" action="/registerUser" th:object="${registrationUser}">

        <!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />　　postmanのため一時的にコメントアウト -->
        <div>
            <!-- <span th:errors="*{userName}" class="error-message"></span> -->
            <!-- ここにエラーメッセージが表示される -->
            <label for="userName">名前</label>
            <!-- ★★★ 修正: name属性を削除し、th:field属性を追加 ★★★ -->
            <input type="text" id="userName" name="userName">
            <!-- th:field="*{userName}" -->
        </div>
        <div>

            <label for="password">パスワード</label>
            <input type="password" id="password" name="password">
        </div>
        <div>

            <label for="confirmPassword">パスワード確認</label>
            <input type="password" id="confirmPassword" name="confirmPassword">
        </div>

        <button type="submit">登録</button>
    </form>
    <a href="/login">ログインはこちら</a>
    <a href="/responseSample">サンプルはこちら</a>
</body>

</html>
