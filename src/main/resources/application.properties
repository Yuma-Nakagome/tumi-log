spring.application.name=tumi-log
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# ドライバークラス名（JPA/Hibernateが使用）
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA/Hibernate 設定 ---
# 実行時にSQLをコンソールに出力して確認できるようにする (デバッグに便利)
spring.jpa.show-sql=true
# テーブルの自動生成（開発初期段階でのみ使用。本番では手動で作成すべき）
spring.jpa.hibernate.ddl-auto=update
# JPAが使用するDialect (PostgreSQLDialectを指定してPostgreSQLに最適化)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Thymeleaf/Web 設定 ---
# アプリケーションが起動するポート番号 (デフォルトは8080)
server.port=8081
# 認証フローが見えるようにSpring SecurityのログレベルをDEBUGに設定
logging.level.org.springframework.security=DEBUG