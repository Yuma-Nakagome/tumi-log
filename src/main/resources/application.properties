spring.application.name=tumi-log
spring.datasource.url=jdbc:mysql://localhost:3306/tally_db?allowPublicKeyRetrieval=true&serverTimezone=UTC
# MySQLのユーザー名
spring.datasource.username=root
# MySQLのパスワード
spring.datasource.password=33133313
# ドライバークラス名（JPA/Hibernateが使用）
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA/Hibernate 設定 ---
# 実行時にSQLをコンソールに出力して確認できるようにする (デバッグに便利)
spring.jpa.show-sql=true
# テーブルの自動生成（開発初期段階でのみ使用。本番では手動で作成すべき）
spring.jpa.hibernate.ddl-auto=update
# JPAが使用するDialect (MySQL用)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# --- Thymeleaf/Web 設定 ---
# アプリケーションが起動するポート番号 (デフォルトは8080)
server.port=8081
# 認証フローが見えるようにSpring SecurityのログレベルをDEBUGに設定
logging.level.org.springframework.security=DEBUG